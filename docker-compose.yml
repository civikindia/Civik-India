version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONUNBUFFERED=1
      - MYSQL_USER=civikindia_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - MYSQL_DB=civikindia
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    command: >
      sh -c "python deploy/bootstrap.py && exec gunicorn --workers 4 --bind 0.0.0.0:8000 --timeout 120 wsgi:app"
    networks:
      - civikindia-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: civikindia
      MYSQL_USER: civikindia_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - civikindia-network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - civikindia-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/civikindia/uploads:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - civikindia-network

volumes:
  mysql_data:
  uploads:

networks:
  civikindia-network:
    driver: bridge
