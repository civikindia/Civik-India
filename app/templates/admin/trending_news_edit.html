{% extends 'base.html' %}
{% block title %}Edit Trending News{% endblock %}

{% block content %}
<div class="py-4 admin-dashboard-v2 dashboard-shell">
  <div class="container" style="max-width:700px;">
    <div class="dashboard-page-header mb-4">
      <div>
        <h1><i class="bi bi-pencil"></i> Edit News Item</h1>
        <p>Update the headline, badge, link, and order.</p>
      </div>
      <a href="{{ url_for('admin.trending_news_list') }}" class="btn btn-gov-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>

    <div class="mibsp-card p-4">
      <form method="POST" action="{{ url_for('admin.edit_trending_news', item_id=item.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="edit_headline">Headline <span class="text-danger">*</span></label>
          <input type="text" id="edit_headline" name="headline" class="form-control"
                 value="{{ item.headline }}" maxlength="300" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="edit_badge">Badge Label</label>
          <input type="text" id="edit_badge" name="badge_label" class="form-control"
                 value="{{ item.badge_label or '' }}" maxlength="40"
                 placeholder="BREAKING / UPDATE / NOTICE">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="edit_link">Link URL (optional)</label>
          <input type="url" id="edit_link" name="link_url" class="form-control"
                 value="{{ item.link_url or '' }}"
                 placeholder="https://...">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="edit_order">Display Order</label>
          <input type="number" id="edit_order" name="display_order" class="form-control"
                 value="{{ item.display_order }}" min="0" max="999">
        </div>
        <div class="d-flex gap-3">
          <button type="submit" class="btn btn-gov-primary">
            <i class="bi bi-check-circle me-1"></i>Save Changes
          </button>
          <a href="{{ url_for('admin.trending_news_list') }}" class="btn btn-gov-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
