{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card login-wrap shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="portal-shield mx-auto mb-3" aria-hidden="true"><i class="bi bi-shield-lock"></i></span>
                            <h1 class="h4 mb-2">Create New Password</h1>
                            <p class="text-muted mb-0">Choose a strong password for your CivikIndia staff account.</p>
                        </div>
                        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label for="new_password" class="form-label fw-semibold">New Password</label>
                                <input type="password" class="form-control form-control-lg" id="new_password" name="new_password" autocomplete="new-password" minlength="12" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                                <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="12" required>
                            </div>
                            <div class="form-text mb-4">Use at least 12 characters with uppercase, lowercase, number, and special character.</div>
                            <button type="submit" class="btn btn-gov-primary btn-lg w-100">
                                Reset Password <i class="bi bi-check-circle ms-2"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
