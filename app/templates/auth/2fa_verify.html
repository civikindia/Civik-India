{% extends "base.html" %}
{% block title %}Two-Factor Verification{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-wrap">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-mark mx-auto mb-3" style="width: 60px; height: 60px; font-size: 24px;">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h2 class="h4">Two-Factor Authentication</h2>
                        <p class="text-muted">Enter the code from your authenticator app.</p>
                    </div>
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4">
                            <input type="text" class="form-control text-center fs-4" style="letter-spacing: 0.5em;" id="otp" name="otp" required autocomplete="off" placeholder="000000" autofocus>
                            <div class="form-text text-center mt-2">You can also use an 8-character backup code.</div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Verify</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
