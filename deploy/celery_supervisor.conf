[program:civikindia_celery]
command=/var/www/civikindia/venv/bin/celery -A app.celery worker --loglevel=info --concurrency=2
directory=/var/www/civikindia
user=www-data
autostart=true
autorestart=true
stopwaitsecs=600
killasgroup=true
priority=998
environment=PATH="/var/www/civikindia/venv/bin",FLASK_ENV="production"
stdout_logfile=/var/log/civikindia/celery.log
stderr_logfile=/var/log/civikindia/celery_err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5

[program:civikindia_celery_beat]
command=/var/www/civikindia/venv/bin/celery -A app.celery beat --loglevel=info
directory=/var/www/civikindia
user=www-data
autostart=true
autorestart=true
stopwaitsecs=600
killasgroup=true
priority=999
environment=PATH="/var/www/civikindia/venv/bin",FLASK_ENV="production"
stdout_logfile=/var/log/civikindia/celery_beat.log
stderr_logfile=/var/log/civikindia/celery_beat_err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
